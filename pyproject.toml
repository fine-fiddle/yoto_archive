[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yoto-archive"
version = "0.1.0"
description = "Back up Yoto cards or incrementally archive an account"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
yoto-archive = "yoto_archive:main"

[tool.setuptools]
py-modules = ["yoto_archive", "yoto_account"]
